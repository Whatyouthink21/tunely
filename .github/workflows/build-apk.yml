name: Build debug APK

on:
  # Build every branch and PR so a change is verified before it reaches main.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships with the Android SDK, so no separate setup action is needed.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # Puts the important error lines on the run's summary page, even when the build fails.
      - name: Show errors
        if: always()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E -A4 '^e: |error:|What went wrong|FAILURE|Could not' build.log | head -n 80 || echo 'No error lines found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are readable from the API without downloading the log.
          grep -E -A2 '^e: file' build.log | head -n 45 | while IFS= read -r line; do
            echo "::error title=Kotlin compile error::${line}"
          done

      # Keeps the build status (and any compiler output) in the PR conversation.
      - name: Report build status on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            {
              echo '### ✅ Build succeeded'
              echo
              echo "Debug APK: download the **tunely-debug-apk** artifact from [this run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            } > /tmp/comment.md
          else
            {
              echo '### ❌ Build failed'
              echo
              echo '```'
              grep -E -A4 '^e: |error:|What went wrong|Execution failed' build.log | head -n 160 || echo 'No matching error lines'
              echo '```'
            } > /tmp/comment.md
          fi
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md --edit-last --create-if-none || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: tunely-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
